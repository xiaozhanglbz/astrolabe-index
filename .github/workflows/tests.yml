name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: smoke test on the demo archive
        run: |
          python examples/make_demo.py /tmp/demo-archive
          python -m astrolabe build /tmp/demo-archive --split-threshold 30
          python -m astrolabe check /tmp/demo-archive
          python -m astrolabe stats /tmp/demo-archive